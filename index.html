<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smoking Tracker Pro - 15h Logic</title>
    
    <!-- Firebase & Chart.js -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --primary: #00e676; --error: #ff4444; --bg: #1a1a1a; --card: #262626; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Utility */
        .hidden { display: none !important; }
        button { cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; }

        /* Login Screen */
        #loginScreen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loginBtn { padding: 15px 30px; font-size: 1.2em; background: #4285F4; color: white; border-radius: 8px; }

        /* Calendar */
        .calendar-container { background: var(--card); padding: 20px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-days a { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #333; border-radius: 5px; font-size: 0.9em; cursor: pointer; text-decoration: none; color: inherit; position: relative; }
        .calendar-days a.today { border: 2px solid var(--primary); }
        .day-count { font-size: 0.7em; color: var(--primary); font-weight: bold; margin-top: 2px; }

        /* Tracker */
        .tracker-container { width: 100%; max-width: 600px; background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; }
        .daily-box { background: #333; padding: 20px; border-radius: 10px; text-align: center; position: relative; }
        .stat-val { font-size: 2.5em; font-weight: bold; color: var(--primary); }
        
        /* Log Button States */
        .log-btn { width: 100%; padding: 18px; font-size: 1.1em; font-weight: bold; color: white; border-radius: 30px; margin-top: 15px; }
        .log-btn[data-status="allowed"] { background: var(--primary); color: #1a1a1a; }
        .log-btn[data-status="cooldown"] { background: #ffa500; }
        
        /* Table & Early Log Style */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 0.9em; }
        
        /* MODIFIED: Red Color for Early Logs */
        .diff-early { color: var(--error) !important; font-weight: bold; }

        /* Wishlist */
        .wishlist-container { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        .wishlist-item { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid #555; }
        .wishlist-item.completed { border-left-color: var(--primary); }
        .progress-bg { background: #444; height: 8px; border-radius: 4px; overflow: hidden; margin: 5px 0; }
        .progress-fill { background: linear-gradient(90deg, #9c27b0, #e91e63); height: 100%; transition: 0.5s; width: 0%; }

        /* Monitor Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .detox-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: #333; color: #aaa; text-align: center; border-radius: 5px; cursor: pointer; }
        .tab.active { background: #555; color: white; font-weight: bold; }
        .chart-container { height: 250px; margin-top: 20px; position: relative; }

        /* Tree Icon */
        .living-tree-icon { position: absolute; top: 10px; right: 10px; font-size: 2.5em; }
        .tree-green { filter: drop-shadow(0 0 5px var(--primary)); }
        .tree-yellow { filter: sepia(100%) hue-rotate(20deg); }
        .tree-red { filter: grayscale(100%) drop-shadow(0 0 5px red); }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="loginScreen">
        <h1 style="color: var(--primary); margin-bottom: 20px;">SMOKING TRACKER</h1>
        <button id="loginBtn" onclick="login()">Sign in with Google</button>
    </div>

    <!-- User Info Bar -->
    <div id="userInfo" class="hidden" style="width: 100%; max-width: 600px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.8em;">
        <span id="userEmail"></span>
        <button onclick="auth.signOut()" style="background: var(--error); color: white; padding: 5px 10px; border-radius: 4px;">Logout</button>
    </div>

    <!-- Calendar View -->
    <div id="calendarContainer" class="calendar-container hidden">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&lt;</button>
            <h3 id="monthLabel"></h3>
            <button onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="calendar-days" id="calendarGrid"></div>
        <button id="logTodayQuick" class="log-btn" onclick="handleLog('today')">Log Today</button>
    </div>

    <!-- Tracker View -->
    <div id="trackerContainer" class="tracker-container hidden">
        <button onclick="showCalendar()" style="background:#555; color:white; padding:8px 15px; margin-bottom:15px; border-radius: 5px;">&larr; Back to Calendar</button>
        
        <div class="daily-box">
            <div id="treeIcon" class="living-tree-icon">🌳</div>
            <div style="font-size: 0.9em; color: #aaa;">Status for <span id="displayDate"></span></div>
            <div class="stat-val" id="countDisplay">0</div>
            
            <div style="display:flex; justify-content: space-around; margin: 15px 0; background: #222; padding: 15px; border-radius: 8px;">
                <div>Spent: <span style="color:#ffc107" id="spentVal">$0.00</span></div>
                <div>Saved: <span style="color:var(--primary)" id="savedVal">$0.00</span></div>
            </div>

            <!-- Wishlist -->
            <div class="wishlist-container">
                <div style="font-size:0.8em; color:#888; margin-bottom:10px; font-weight:bold;">WISHLIST PROGRESS</div>
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <input type="text" id="goalName" placeholder="New Goal Name" style="flex:2; padding:8px; background:#333; border:1px solid #444; color:white; border-radius:4px;">
                    <input type="number" id="goalCost" placeholder="Cost $" style="flex:1; padding:8px; background:#333; border:1px solid #444; color:white; border-radius:4px;">
                    <button onclick="addGoal()" style="background:var(--primary); padding:0 15px; border-radius:4px;">+</button>
                </div>
                <div id="goalList"></div>
            </div>

            <!-- Settings -->
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:20px; font-size:0.7em; color:#aaa;">
                <div>Pack Price ($)<input type="number" id="packPrice" step="0.1" onchange="updateSettings()" style="width:90%; background:#222; color:white; border:1px solid #444; padding:4px;"></div>
                <div>Cigs/Pack<input type="number" id="packSize" onchange="updateSettings()" style="width:90%; background:#222; color:white; border:1px solid #444; padding:4px;"></div>
                <div>Old Baseline<input type="number" id="baseline" onchange="updateSettings()" style="width:90%; background:#222; color:white; border:1px solid #444; padding:4px;"></div>
            </div>

            <div style="margin-top:20px;">
                Daily Limit: <input type="number" id="dailyLimit" oninput="document.getElementById('saveLimitBtn').classList.remove('hidden')" style="width:60px; background:#444; color:white; border:none; padding:8px; border-radius:4px; text-align:center;">
                <button id="saveLimitBtn" class="hidden" onclick="saveLimit()" style="background:var(--primary); padding:8px 15px; border-radius:4px;">Save Limit</button>
            </div>
        </div>

        <!-- Data Table -->
        <table class="data-table">
            <thead><tr><th>Time</th><th>Diff</th><th>Reason</th><th></th></tr></thead>
            <tbody id="logsTableBody"></tbody>
        </table>

        <!-- Log Controls -->
        <div style="margin-top:20px;">
            <select id="reasonSelect" style="width:100%; padding:15px; background:#333; color:white; border:1px solid #444; border-radius:8px; margin-bottom:10px;">
                <option value="Routine">Routine ☕</option>
                <option value="Stress">Stress ⚡</option>
                <option value="Boredom">Boredom 😐</option>
                <option value="After Meal">After Meal 🍽️</option>
            </select>
            <button id="mainLogBtn" class="log-btn" onclick="handleLog('selected')">Log New Cigarette</button>
        </div>

        <!-- Floating Buttons -->
        <div style="display:flex; justify-content:center; gap:20px; margin-top:30px;">
            <button onclick="openMonitor()" style="background:transparent; border:1px solid #555; padding:15px; border-radius:12px; font-size:1.5em;">📊 Monitor</button>
            <button onclick="resetData()" style="background:transparent; border:1px solid var(--error); padding:15px; border-radius:12px; font-size:1.5em; color:var(--error);">🗑️</button>
        </div>
    </div>

    <!-- Monitor Modal -->
    <div id="monitorModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2 style="margin:0;">Monitor</h2>
                <button onclick="closeModal()" style="background:none; color:white; font-size:2em;">&times;</button>
            </div>
            
            <div class="detox-tabs">
                <div class="tab active" id="tabDaily" onclick="switchMonitorTab('daily')">Reduction</div>
                <div class="tab" id="tabMoney" onclick="switchMonitorTab('money')">Money Saved</div>
            </div>

            <div id="monitorDailyView">
                <div style="background:#333; padding:15px; border-radius:10px; text-align:center;">
                    <div style="font-size:0.9em; color:#aaa;">Reduction Rate</div>
                    <div style="font-size:2.5em; color:var(--primary); font-weight:bold;" id="reductionPerc">0%</div>
                    <div style="margin-top:10px;">Avoided Today: <span id="avoidedCount" style="color:var(--primary); font-weight:bold;">0</span></div>
                </div>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>

            <div id="monitorMoneyView" class="hidden">
                <div style="text-align:center; background:#333; padding:15px; border-radius:10px;">
                    <div style="font-size:0.9em; color:#aaa;">Total Savings</div>
                    <div style="font-size:2.5em; color:#ffc107; font-weight:bold;" id="totalSavedMoney">$0.00</div>
                </div>
                <div class="chart-container"><canvas id="moneyChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        // 1. Firebase Configuration
        const firebaseConfig = { apiKey: "AIzaSyC7K8VY7GHb9BnA2OIpUN__zlm_OZm0kas", authDomain: "my-smoking-tracker.firebaseapp.com", projectId: "my-smoking-tracker", storageBucket: "my-smoking-tracker.firebasestorage.app", messagingSenderId: "464362470086", appId: "1:464362470086:web:1c43ae97b42b7b1db4f5c7" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 2. State Variables
        let currentUser = null;
        let smokingData = { dailyRecords: {}, settings: { packPrice: 0, packSize: 20, baseline: 20, wishlistGoals: [] } };
        let currentDate = new Date();
        let selectedDateKey = null;
        let trendChartInstance = null;
        let moneyChartInstance = null;

        // 3. Auth State
        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
                syncData();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        });

        // 4. Database Sync
        function syncData() {
            db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    smokingData = data.smokingData || smokingData;
                    renderCalendar();
                    if (selectedDateKey) refreshTrackerUI();
                }
            });
        }

        function pushData() {
            if (currentUser) db.collection('users').doc(currentUser.uid).set({ smokingData });
        }

        // 5. Calendar Logic
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('monthLabel');
            grid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            label.textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<a></a>';

            for (let d = 1; d <= totalDays; d++) {
                const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const record = smokingData.dailyRecords[key];
                const count = record ? record.entries.length : 0;
                
                const dayEl = document.createElement('a');
                dayEl.innerHTML = `<span>${d}</span>${count > 0 ? `<span class="day-count">${count}</span>` : ''}`;
                if (key === new Date().toISOString().split('T')[0]) dayEl.className = 'today';
                dayEl.onclick = () => showTracker(key);
                grid.appendChild(dayEl);
            }
            updateButtonStatus();
        }

        function showTracker(dateKey) {
            selectedDateKey = dateKey;
            document.getElementById('displayDate').textContent = dateKey;
            document.getElementById('calendarContainer').classList.add('hidden');
            document.getElementById('trackerContainer').classList.remove('hidden');
            refreshTrackerUI();
        }

        function showCalendar() {
            selectedDateKey = null;
            document.getElementById('calendarContainer').classList.remove('hidden');
            document.getElementById('trackerContainer').classList.add('hidden');
            renderCalendar();
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        // 6. Logging Logic (15-Hour Cooldown)
        function handleLog(type) {
            const now = new Date();
            const todayKey = now.toISOString().split('T')[0];
            const targetKey = type === 'today' ? todayKey : selectedDateKey;
            
            if (!smokingData.dailyRecords[targetKey]) {
                smokingData.dailyRecords[targetKey] = { entries: [], limit: smokingData.settings.baseline || 20, lastActivity: 0 };
            }

            const record = smokingData.dailyRecords[targetKey];
            const btn = type === 'today' ? document.getElementById('logTodayQuick') : document.getElementById('mainLogBtn');
            
            let isEarly = false;
            if (btn.getAttribute('data-status') === 'cooldown') {
                if (!confirm("Still in cooldown period. Log anyway?")) return;
                isEarly = true; // Flag for red highlight
            }

            record.entries.push({
                id: Date.now(),
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: now.getTime(),
                reason: document.getElementById('reasonSelect').value,
                isEarly: isEarly
            });

            record.lastActivity = now.getTime();
            pushData();
        }

        function updateButtonStatus() {
            const now = Date.now();
            const todayKey = new Date().toISOString().split('T')[0];
            const b1 = document.getElementById('logTodayQuick');
            const b2 = document.getElementById('mainLogBtn');

            const applyLogic = (btn, key) => {
                const record = smokingData.dailyRecords[key];
                if (!record || !record.limit || record.entries.length === 0) {
                    btn.setAttribute('data-status', 'allowed');
                    btn.innerHTML = "Log Cigarette";
                    return;
                }
                // 15 Hours Logic = 54,000,000 milliseconds
                const cooldownMs = 54000000 / record.limit;
                const nextAllowed = record.lastActivity + cooldownMs;
                const remaining = nextAllowed - now;

                if (remaining > 0) {
                    btn.setAttribute('data-status', 'cooldown');
                    const mins = Math.ceil(remaining / 60000);
                    btn.innerHTML = `Wait (${mins}m)`;
                } else {
                    btn.setAttribute('data-status', 'allowed');
                    btn.innerHTML = "Log Cigarette";
                }
            };

            if (b1) applyLogic(b1, todayKey);
            if (b2 && selectedDateKey) applyLogic(b2, selectedDateKey);
        }

        // 7. UI Refreshes & Table
        function refreshTrackerUI() {
            const record = smokingData.dailyRecords[selectedDateKey] || { entries: [], limit: smokingData.settings.baseline };
            document.getElementById('countDisplay').textContent = record.entries.length;
            document.getElementById('dailyLimit').value = record.limit;
            
            // Sync Settings
            document.getElementById('packPrice').value = smokingData.settings.packPrice;
            document.getElementById('packSize').value = smokingData.settings.packSize;
            document.getElementById('baseline').value = smokingData.settings.baseline;

            // Render Table
            const body = document.getElementById('logsTableBody');
            body.innerHTML = '';
            record.entries.forEach((entry, i) => {
                let diff = "-";
                if (i > 0) {
                    const diffMs = entry.timestamp - record.entries[i-1].timestamp;
                    const mins = Math.floor(diffMs / 60000);
                    diff = mins >= 60 ? Math.floor(mins/60) + "h " + (mins%60) + "m" : mins + "m";
                }
                // MODIFIED: Apply diff-early if isEarly is true
                body.innerHTML += `<tr>
                    <td>${entry.time}</td>
                    <td class="${entry.isEarly ? 'diff-early' : ''}">${diff}</td>
                    <td>${entry.reason}</td>
                    <td><button onclick="deleteEntry(${entry.id})" style="color:var(--error); background:none; font-size:1.2em;">&times;</button></td>
                </tr>`;
            });

            updateMoneyStats();
            updateTreeIcon(record.entries.length, record.limit);
            updateButtonStatus();
            renderGoals();
        }

        function updateMoneyStats() {
            const price = smokingData.settings.packPrice || 0;
            const size = smokingData.settings.packSize || 1;
            const costPerCig = price / size;
            const record = smokingData.dailyRecords[selectedDateKey] || { entries: [] };
            
            document.getElementById('spentVal').textContent = "$" + (record.entries.length * costPerCig).toFixed(2);
            
            const baseline = smokingData.settings.baseline || 0;
            const saved = Math.max(0, baseline - record.entries.length) * costPerCig;
            document.getElementById('savedVal').textContent = "$" + saved.toFixed(2);
        }

        function updateTreeIcon(count, limit) {
            const icon = document.getElementById('treeIcon');
            const ratio = count / (limit || 1);
            icon.className = 'living-tree-icon';
            if (ratio < 0.6) { icon.textContent = "🌳"; icon.classList.add('tree-green'); }
            else if (ratio <= 1) { icon.textContent = "🍂"; icon.classList.add('tree-yellow'); }
            else { icon.textContent = "🥀"; icon.classList.add('tree-red'); }
        }

        // 8. Wishlist Logic
        function addGoal() {
            const name = document.getElementById('goalName').value;
            const cost = parseFloat(document.getElementById('goalCost').value);
            if (name && cost) {
                if (!smokingData.settings.wishlistGoals) smokingData.settings.wishlistGoals = [];
                smokingData.settings.wishlistGoals.push({ id: Date.now(), name, cost });
                document.getElementById('goalName').value = '';
                document.getElementById('goalCost').value = '';
                pushData();
            }
        }

        function renderGoals() {
            const list = document.getElementById('goalList');
            list.innerHTML = '';
            
            const costPerCig = (smokingData.settings.packPrice || 0) / (smokingData.settings.packSize || 1);
            const baseline = smokingData.settings.baseline || 0;
            let totalSaved = 0;

            // Calculate total accumulated savings from all time
            Object.keys(smokingData.dailyRecords).forEach(k => {
                const count = smokingData.dailyRecords[k].entries.length;
                if (count < baseline) totalSaved += (baseline - count) * costPerCig;
            });

            let currentBalance = totalSaved;
            const goals = smokingData.settings.wishlistGoals || [];

            goals.forEach(goal => {
                const progress = Math.min(100, (currentBalance / goal.cost) * 100);
                const item = document.createElement('div');
                item.className = `wishlist-item ${progress >= 100 ? 'completed' : ''}`;
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:0.8em; margin-bottom:5px;">
                        <span>${goal.name}</span><span>$${goal.cost}</span>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <button onclick="removeGoal(${goal.id})" style="background:none; color:var(--error); font-size:0.7em; float:right; margin-top:5px;">Remove</button>
                    <div style="clear:both;"></div>
                `;
                currentBalance = Math.max(0, currentBalance - goal.cost);
                list.appendChild(item);
            });
        }

        function removeGoal(id) {
            smokingData.settings.wishlistGoals = smokingData.settings.wishlistGoals.filter(g => g.id !== id);
            pushData();
        }

        // 9. Monitor & Detox Logic
        function openMonitor() {
            document.getElementById('monitorModal').classList.add('active');
            switchMonitorTab('daily');
        }

        function closeModal() {
            document.getElementById('monitorModal').classList.remove('active');
        }

        function switchMonitorTab(tab) {
            document.getElementById('tabDaily').classList.toggle('active', tab === 'daily');
            document.getElementById('tabMoney').classList.toggle('active', tab === 'money');
            document.getElementById('monitorDailyView').classList.toggle('hidden', tab !== 'daily');
            document.getElementById('monitorMoneyView').classList.toggle('hidden', tab !== 'money');
            
            if (tab === 'daily') renderTrendChart();
            else renderMoneyChart();
        }

        function renderTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const keys = Object.keys(smokingData.dailyRecords).sort().slice(-7);
            const values = keys.map(k => smokingData.dailyRecords[k].entries.length);
            
            // Calculate Reduction Stats
            const todayKey = new Date().toISOString().split('T')[0];
            const todayCount = smokingData.dailyRecords[todayKey]?.entries.length || 0;
            const baseline = smokingData.settings.baseline || 1;
            const reduction = Math.round(((baseline - todayCount) / baseline) * 100);
            
            document.getElementById('reductionPerc').textContent = (reduction > 0 ? reduction : 0) + "%";
            document.getElementById('avoidedCount').textContent = Math.max(0, baseline - todayCount);

            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: keys.map(k => k.split('-')[2]),
                    datasets: [{ label: 'Cigarettes', data: values, borderColor: '#00e676', backgroundColor: 'rgba(0, 230, 118, 0.1)', fill: true, tension: 0.3 }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#333' } } } }
            });
        }

        function renderMoneyChart() {
            const ctx = document.getElementById('moneyChart').getContext('2d');
            const costPerCig = (smokingData.settings.packPrice || 0) / (smokingData.settings.packSize || 1);
            const baseline = smokingData.settings.baseline || 0;
            
            const last7Keys = Object.keys(smokingData.dailyRecords).sort().slice(-7);
            const savingsData = last7Keys.map(k => {
                const count = smokingData.dailyRecords[k].entries.length;
                return Math.max(0, baseline - count) * costPerCig;
            });

            let grandTotalSaved = 0;
            Object.keys(smokingData.dailyRecords).forEach(k => {
                const count = smokingData.dailyRecords[k].entries.length;
                grandTotalSaved += Math.max(0, baseline - count) * costPerCig;
            });
            document.getElementById('totalSavedMoney').textContent = "$" + grandTotalSaved.toFixed(2);

            if (moneyChartInstance) moneyChartInstance.destroy();
            moneyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: last7Keys.map(k => k.split('-')[2]),
                    datasets: [{ label: 'Money Saved ($)', data: savingsData, backgroundColor: '#ffc107' }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        // 10. Settings & Reset
        function updateSettings() {
            smokingData.settings.packPrice = parseFloat(document.getElementById('packPrice').value) || 0;
            smokingData.settings.packSize = parseInt(document.getElementById('packSize').value) || 20;
            smokingData.settings.baseline = parseInt(document.getElementById('baseline').value) || 20;
            pushData();
        }

        function saveLimit() {
            if (selectedDateKey) {
                if (!smokingData.dailyRecords[selectedDateKey]) {
                    smokingData.dailyRecords[selectedDateKey] = { entries: [], limit: 20, lastActivity: 0 };
                }
                smokingData.dailyRecords[selectedDateKey].limit = parseInt(document.getElementById('dailyLimit').value);
                document.getElementById('saveLimitBtn').classList.add('hidden');
                pushData();
            }
        }

        function deleteEntry(id) {
            if (confirm("Delete this entry?")) {
                smokingData.dailyRecords[selectedDateKey].entries = smokingData.dailyRecords[selectedDateKey].entries.filter(e => e.id !== id);
                pushData();
            }
        }

        function resetData() {
            if (confirm("CRITICAL: Erase all smoking records? This cannot be undone.")) {
                smokingData.dailyRecords = {};
                pushData();
            }
        }

        // Auto-update button timers every 30 seconds
        setInterval(updateButtonStatus, 30000);
    </script>
</body>
</html>
